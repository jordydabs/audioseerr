name: Feature request
description: Suggest an idea or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check the [feature list](https://github.com/jordydabs/audioseerr#features) and the [existing issues](https://github.com/jordydabs/audioseerr/issues?q=is%3Aissue) to see whether it's already covered or requested.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your situation and what is hard or missing today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: The change you have in mind — as concrete as you like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, links to similar tools, …
