name: Bug report
description: Something isn't working the way it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please check the [README](https://github.com/jordydabs/audioseerr#readme) and the [existing issues](https://github.com/jordydabs/audioseerr/issues?q=is%3Aissue) first.

        > **Never paste API keys, your `JWT_SECRET`, passwords, or the contents of your `.env` or `db.json`.** Redact them from logs and screenshots.

        Found a security problem? Please don't file it here — see the [security policy](https://github.com/jordydabs/audioseerr/security/policy).
  - type: input
    id: version
    attributes:
      label: AudioSeerr version
      description: Shown in the sidebar, and in the `version` field of `GET /api/health`.
      placeholder: "2.10.0"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - Docker Compose (the docker-compose.yml from this repo)
        - Docker (my own setup)
        - Bare metal (npm start)
        - Something else
    validations:
      required: true
  - type: input
    id: lidarr
    attributes:
      label: Lidarr version
      description: Optional, but helpful for anything involving requests, the library or the download queue.
      placeholder: "e.g. 2.x"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The last ~50 lines of `docker compose logs audioseerr` (or your terminal output). Remove any secrets first.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, browser and device, reverse proxy or iframe embedding, …
